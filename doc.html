<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Приложить документ</title>
<!--
  ФИНЦЕНТР Z-463 — приложить документ к заявке. Репозиторий z463-app.
  Версия 1.0 · 23.09.2026

  Зачем отдельная страница. Приложить платёжку прямо на экране оплат не
  удавалось ни Лауре, ни Ерсайыну: выбор файла открывался, но файл не
  приходил. На том же телефоне и у того же человека форма подачи файл
  принимала. Отличие — в устройстве страницы: экран оплат пересобирает
  содержимое кодом, а форма подачи стоит в разметке. Эта страница сделана
  по образцу формы подачи: статичная разметка, поле выбора файла объявлено
  в HTML, ничего не перерисовывается.

  Открывается кнопкой «🧾 Приложить платёжку» под сообщением «Оплачено»
  и принимает номер заявки параметром &n=. Кто что вправе приложить,
  решает сервер: платёжку — казначей по оплаченной заявке, счёт — автор.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:      var(--tg-theme-bg-color, #ffffff);
    --fg:      var(--tg-theme-text-color, #000000);
    --muted:   var(--tg-theme-hint-color, #8b8b8b);
    --card:    var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent:  var(--tg-theme-button-color, #2481cc);
    --onAccent:var(--tg-theme-button-text-color, #ffffff);
    --danger:  #d64545;
    --line:    rgba(128,128,128,.22);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg); }
  body{
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px 16px 120px;
  }
  h1{ font-size:20px; font-weight:600; margin:4px 0 2px; }
  .who{ color:var(--muted); font-size:14px; margin-bottom:20px; }

  label{ display:block; font-size:14px; color:var(--muted); margin:0 0 6px; }
  .field{ margin-bottom:20px; }

  input[type=text], input[type=tel], textarea{
    width:100%; font:inherit; color:var(--fg); background:var(--card);
    border:1px solid transparent; border-radius:12px; padding:13px 14px;
    appearance:none;
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  textarea{ resize:none; min-height:76px; }

  /* Сумма — единственный крупный элемент. Её проверяют и заявитель,
     и согласующий, поэтому она должна читаться с вытянутой руки. */
  #sum{ font-size:30px; font-weight:600; letter-spacing:-0.5px; padding:14px; }
  .sumRow{ display:flex; align-items:baseline; gap:10px; }
  .sumRow .cur{ font-size:20px; color:var(--muted); }

  .opts{ display:flex; gap:10px; }
  .opt{
    flex:1; text-align:center; padding:13px 8px; border-radius:12px;
    background:var(--card); border:1.5px solid transparent; cursor:pointer;
    font-size:15px; user-select:none;
  }
  .opt[aria-pressed="true"]{ border-color:var(--accent); color:var(--accent); font-weight:600; }

  .check{ display:flex; align-items:center; gap:12px; padding:13px 14px;
          background:var(--card); border-radius:12px; cursor:pointer; }
  .check input{ width:20px; height:20px; accent-color:var(--accent); margin:0; flex:none; }
  .check span{ font-size:15px; }
  .check small{ display:block; color:var(--muted); font-size:13px; }

  .found{ margin-top:8px; border-radius:12px; overflow:hidden; background:var(--card); }
  .found div{ padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; font-size:15px; }
  .found div:last-child{ border-bottom:none; }
  .picked{ display:flex; align-items:center; justify-content:space-between; gap:12px;
           background:var(--card); border-radius:12px; padding:13px 14px; }
  .picked b{ font-weight:600; }
  .picked button{ background:none; border:none; color:var(--accent); font:inherit;
                  padding:0; cursor:pointer; flex:none; }

  .submit{
    position:fixed; left:0; right:0; bottom:0; padding:12px 16px 20px;
    background:linear-gradient(to top, var(--bg) 72%, transparent);
  }
  .submit button{
    width:100%; padding:16px; font:inherit; font-size:17px; font-weight:600;
    background:var(--accent); color:var(--onAccent); border:none; border-radius:12px;
    cursor:pointer;
  }
  .submit button[disabled]{ opacity:.45; }

  .msg{ padding:14px; border-radius:12px; font-size:15px; margin-bottom:18px;
        background:rgba(214,69,69,.13); color:var(--danger); }
  .msg small{ display:block; margin-top:8px; color:var(--muted); font-size:13px; }
  .hint{ color:var(--muted); font-size:13px; margin-top:6px; }
  .attach{ width:100%; padding:14px; border-radius:12px; font-size:16px; cursor:pointer;
    border:1px dashed var(--hint,#8a8a8e); background:transparent; color:var(--link,#2481cc); }
  .attach:active{ opacity:.7; }
  .fileRow{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:14px; }
  .fileRow span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fileRow button{ border:0; background:transparent; color:var(--destr,#e53935); font-size:15px; cursor:pointer; }
  .hidden{ display:none !important; }

  .done{ text-align:center; padding:56px 20px; }
  .done .num{ font-size:40px; font-weight:600; margin:14px 0 6px; }
  .done p{ color:var(--muted); margin:0 0 26px; }
  .done button{ font:inherit; font-size:16px; padding:14px 30px; border:none;
                border-radius:12px; background:var(--card); color:var(--fg); cursor:pointer; }
</style>
</head>
<body>

<div id="loading" class="who">Открываю заявку…</div>

<div id="blocked" class="hidden">
  <div class="msg" id="blockedText"></div>
</div>

<div id="form" class="hidden">
  <h1 id="ttl">Приложить документ</h1>
  <div class="who" id="who"></div>

  <div id="err" class="msg hidden"></div>

  <div class="field">
    <label id="pickLbl">Файл</label>
    <input type="file" id="pick" accept="image/*,application/pdf" multiple hidden>
    <button type="button" id="attach" class="attach">📎 Выбрать файл или фото</button>
    <div id="files"></div>
    <div class="hint" id="hint2">Фото, скан или PDF. До трёх файлов. Фото уменьшается перед отправкой.</div>
  </div>
</div>

<div class="submit hidden" id="submitBar">
  <button id="send" disabled>Отправить</button>
</div>

<div id="done" class="done hidden">
  <div id="doneTtl">Готово</div>
  <div class="num" id="doneNum"></div>
  <p id="doneText"></p>
  <button id="closeBtn">Закрыть</button>
</div>

<script>
(function(){
  var API_FALLBACK = 'ВСТАВЬТЕ_СЮДА_АДРЕС_РАЗВЁРТЫВАНИЯ';
  var Q = new URLSearchParams(location.search);
  var API_URL = (function(){
    var q = Q.get('api') || '';
    return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(q) ? q : API_FALLBACK;
  })();
  var NUM = Number(Q.get('n')) || 0;

  var tg = window.Telegram && window.Telegram.WebApp;
  var initData = tg ? (tg.initData || '') : '';
  if(tg){ tg.ready(); tg.expand(); }

  var S = { files:[], kind:'pay', sending:false };
  function $(id){ return document.getElementById(id); }
  function show(el,on){ el.classList[on?'remove':'add']('hidden'); }
  function stop(html){
    show($('loading'),false); show($('form'),false); show($('submitBar'),false);
    $('blockedText').innerHTML = html; show($('blocked'),true);
  }
  function err(t){
    var e=$('err');
    if(!t){ show(e,false); return; }
    e.textContent=t; show(e,true);
  }
  function money(n){ return Number(n||0).toLocaleString('ru-RU').replace(/,/g,' ')+' ₸'; }

  function apiOnce(action, data, ms){
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, ms) : 0;
    function done(){ if(timer) clearTimeout(timer); }
    return fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:action, initData:initData, data:data||{}}),
      signal: ctl ? ctl.signal : undefined
    }).then(function(r){ return r.text(); }).then(function(t){
      done();
      try{ return JSON.parse(t); }
      catch(e){ throw new Error('Сервер ответил не по формату.'); }
    }, function(e){ done(); throw e; });
  }
  // Отправку документа повторяем один раз: файл уже уехал, а ответ мог
  // потеряться. Повтор безопасен — тот же файл второй раз не сохранится.
  function api(action, data){
    var once = (action === 'attachInit');
    return apiOnce(action, data, once ? 30000 : 40000).catch(function(e){
      if(once) throw e;
      return new Promise(function(ok){ setTimeout(ok, 2000); })
        .then(function(){ return apiOnce(action, data, 40000); });
    });
  }

  if(!initData){ stop('Эта страница открывается только из Telegram — кнопкой под сообщением о заявке.'); return; }
  if(!NUM){ stop('Не указана заявка.<small>Откройте страницу кнопкой под сообщением бота.</small>'); return; }

  api('attachInit', {n:NUM}).then(function(r){
    if(!r || !r.ok){ stop((r && r.err) ? r.err : 'Не удалось открыть заявку.'); return; }
    S.kind = r.kind;
    var pay = (r.kind === 'pay');
    $('ttl').textContent = pay ? 'Платёжка по заявке №'+r.num : 'Счёт по заявке №'+r.num;
    $('who').textContent = r.sup + ' · ' + money(r.sum) + (r.what ? ' · ' + r.what : '');
    $('pickLbl').textContent = pay ? 'Платёжка' : 'Счёт или накладная';
    $('hint2').textContent = pay
      ? 'Уйдёт заявителю — ' + r.author + '. Фото, скан или PDF, до трёх файлов.'
      : 'Уйдёт тому, у кого заявка сейчас. Фото, скан или PDF, до трёх файлов.';
    show($('loading'),false); show($('form'),true); show($('submitBar'),true);
  }).catch(function(e){
    stop('Сервер не отвечает.<small>'+String(e && e.message || e).slice(0,160)+'</small>');
  });

  // ---------- файлы ----------
  var MAXW = 1600, MAX_FILE = 5*1024*1024, MAX_FILES = 3;
  function human(n){ return n<1048576 ? Math.round(n/1024)+' КБ' : (n/1048576).toFixed(1)+' МБ'; }

  function draw(){
    var box = $('files'); box.innerHTML = '';
    S.files.forEach(function(f,i){
      var row = document.createElement('div'); row.className='fileRow';
      var nm = document.createElement('span'); nm.textContent = f.name+' · '+human(f.bytes);
      var del = document.createElement('button'); del.type='button'; del.textContent='Убрать';
      del.addEventListener('click', function(){ S.files.splice(i,1); draw(); });
      row.appendChild(nm); row.appendChild(del); box.appendChild(row);
    });
    $('attach').textContent = S.files.length ? '📎 Добавить ещё' : '📎 Выбрать файл или фото';
    show($('attach'), S.files.length < MAX_FILES);
    $('send').disabled = !S.files.length || S.sending;
  }

  function shrink(file){
    return new Promise(function(done){
      if(!/^image\//.test(file.type) || /heic|heif/i.test(file.type)) return done(null);
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        try{
          var k = Math.min(1, MAXW/Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url); done(c.toDataURL('image/jpeg', 0.72));
        }catch(e){ URL.revokeObjectURL(url); done(null); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); done(null); };
      img.src = url;
    });
  }
  function readB64(file){
    return new Promise(function(done, fail){
      var r = new FileReader();
      r.onload = function(){ done(String(r.result)); };
      r.onerror = function(){ fail(new Error('нечитаемый файл')); };
      r.readAsDataURL(file);
    });
  }

  $('attach').addEventListener('click', function(){ $('pick').click(); });
  $('pick').addEventListener('change', function(){
    var list = Array.prototype.slice.call($('pick').files || []);
    $('pick').value = '';
    if(!list.length){ err('Файл не выбран.'); return; }
    err(''); $('attach').disabled = true; $('attach').textContent = 'Готовлю…';
    (function next(){
      if(!list.length){ $('attach').disabled = false; draw(); return; }
      var file = list.shift();
      if(S.files.length >= MAX_FILES){ err('Больше '+MAX_FILES+' файлов не нужно.'); return next(); }
      if(file.size === 0){ err('«'+file.name+'» пустой: фото, скорее всего, ещё в iCloud. Откройте его в «Фото» и повторите.'); return next(); }
      shrink(file).then(function(u){
        if(u) return u;
        if(file.size > MAX_FILE){ err('«'+file.name+'» больше 5 МБ — пришлите его боту сообщением.'); return null; }
        return readB64(file);
      }).then(function(u){
        if(u){
          var c = u.indexOf(','), mime = u.slice(5,c).split(';')[0] || file.type || 'application/octet-stream';
          var b64 = u.slice(c+1);
          var name = /^image\//.test(mime) && !/\.(jpe?g|png)$/i.test(file.name) ? file.name+'.jpg' : file.name;
          S.files.push({name:name, mime:mime, data:b64, bytes:Math.round(b64.length*0.75)});
        }
        draw(); next();
      }).catch(function(){ err('Файл не прочитался — попробуйте другой.'); $('attach').disabled=false; next(); });
    })();
  });
  draw();

  // ---------- отправка ----------
  $('send').addEventListener('click', function(){
    if(S.sending || !S.files.length) return;
    err(''); S.sending = true;
    $('send').disabled = true; $('send').textContent = 'Отправляю…';
    api('attach', {num:NUM, files:S.files.map(function(f){ return {name:f.name, mime:f.mime, data:f.data}; })})
      .then(function(r){
        S.sending = false;
        if(!r || !r.ok){
          $('send').disabled = false; $('send').textContent = 'Отправить';
          err((r && r.err) ? r.err : 'Не удалось приложить.');
          return;
        }
        show($('form'),false); show($('submitBar'),false);
        $('doneTtl').textContent = (r.kind==='pay') ? 'Платёжка приложена' : 'Счёт приложен';
        $('doneNum').textContent = '№'+r.num;
        $('doneText').textContent = (r.kind==='pay')
          ? 'Заявитель получил её сообщением. Копия лежит на Диске рядом со счётом.'
          : 'Документ ушёл тому, у кого заявка сейчас.';
        show($('done'),true);
        if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      }).catch(function(){
        S.sending = false;
        $('send').disabled = false; $('send').textContent = 'Отправить';
        err('Ответ не пришёл. Файл мог всё-таки уйти — проверьте чат с ботом, прежде чем отправлять снова.');
      });
  });

  $('closeBtn').addEventListener('click', function(){
    if(tg && tg.close) tg.close(); else window.close();
  });
})();
</script>
</body>
</html>
